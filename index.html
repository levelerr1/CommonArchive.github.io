---
layout: default
---
<div class="feed">
  {% for post in site.posts %}
    {% include entry.html post=post %}
  {% else %}
    <div class="empty-state">
      <p>Nothing's been posted yet.</p>
      <p>Once you add a file to <code>_posts/</code>, it'll show up here.</p>
    </div>
  {% endfor %}
</div>
